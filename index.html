<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자캐 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Hahmlet:wght@300;400;600;800&family=Song+Myung&family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Do+Hyeon&family=Black+Han+Sans&family=Jua&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Dongle:wght@400;700&family=DotGothic16&family=Cute+Font&family=Hi+Melody&family=Gamja+Flower&family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#2A2930; --chrome-2:#3A3941; --chrome-ink:#F2F1F5; --chrome-ink-2:#A9A7B3;
  --panel:#FFFFFF; --panel-2:#F4F3F6; --ink:#1F1E24; --ink-2:#5E5C67; --ink-3:#9B99A5; --line:#E5E3E9;
  --canvas:#E7E6EA; --sel:#6D5DFC; --sel-soft:rgba(109,93,252,.12);
  --ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#222128; --panel-2:#2B2A32; --ink:#EDECF2; --ink-2:#B3B1BD; --ink-3:#7E7C89; --line:#35333D; --canvas:#18171C; }
}
:root[data-theme="dark"]{ --panel:#222128; --panel-2:#2B2A32; --ink:#EDECF2; --ink-2:#B3B1BD; --ink-3:#7E7C89; --line:#35333D; --canvas:#18171C; }
html,body{ height:100%; margin:0; }
*,*::before,*::after{ box-sizing:border-box; }
body{ background:var(--canvas); color:var(--ink); font-family:var(--ui); font-size:13px; -webkit-font-smoothing:antialiased; overflow:hidden; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--sel); outline-offset:1px; }
[hidden]{ display:none !important; }

#app{ height:100%; display:grid; grid-template-rows:48px minmax(0,1fr); grid-template-columns:232px minmax(0,1fr) 264px; }
/* toolbar */
.tb{ grid-column:1/-1; background:var(--chrome); color:var(--chrome-ink); display:flex; align-items:center; gap:4px; padding:0 8px; position:relative; z-index:40; }
.tb .logo{ font-weight:700; font-size:14px; padding:0 10px 0 6px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.tb .logo i{ width:16px; height:16px; border-radius:5px; background:conic-gradient(#F59AB5,#A58BF5,#7FC8E8,#F59AB5); display:inline-block; }
.tb .fname{ background:transparent; border:1px solid transparent; color:var(--chrome-ink); border-radius:6px; padding:5px 8px; width:170px; font-size:13px; }
.tb .fname:hover{ border-color:var(--chrome-2); } .tb .fname:focus{ border-color:var(--sel); outline:none; background:var(--chrome-2); }
.tools{ display:flex; gap:2px; margin:0 auto; }
.tbtn{ appearance:none; border:0; background:none; color:var(--chrome-ink); height:36px; min-width:36px; padding:0 9px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:13px; white-space:nowrap; }
.tbtn:hover{ background:var(--chrome-2); }
.tbtn[aria-pressed="true"]{ background:var(--sel); color:#fff; }
.tbtn:disabled{ opacity:.35; cursor:default; background:none; }
.tbtn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tbtn.primary{ background:var(--sel); color:#fff; padding:0 14px; }
.tbtn.primary:hover{ filter:brightness(1.08); }
.zoom{ font-size:12px; color:var(--chrome-ink-2); min-width:44px; text-align:center; }
.sep{ width:1px; height:22px; background:var(--chrome-2); margin:0 4px; }
.mobonly{ display:none !important; }

/* panels */
.panel{ background:var(--panel); overflow:auto; min-height:0; }
.left{ border-right:1px solid var(--line); display:flex; flex-direction:column; }
.right{ border-left:1px solid var(--line); }
.ph{ display:flex; align-items:center; justify-content:space-between; padding:12px 12px 6px 14px; font-weight:600; font-size:12px; color:var(--ink-2); }
.ph .x{ font-size:16px; }
.pages{ padding:0 6px 8px; border-bottom:1px solid var(--line); }
.row{ display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; cursor:pointer; min-height:30px; }
.row:hover{ background:var(--panel-2); }
.row.on{ background:var(--sel-soft); }
.row .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .ic{ width:16px; text-align:center; color:var(--ink-3); flex:none; font-size:12px; }
.row .mini{ opacity:0; }
.row:hover .mini, .row .mini.act{ opacity:1; }
.row input.rn{ flex:1; min-width:0; border:1px solid var(--sel); border-radius:4px; padding:2px 4px; background:var(--panel); }
.layers{ padding:0 6px 20px; flex:1; overflow:auto; }
.layers .row.hid .nm{ color:var(--ink-3); }
.layers .row.ing{ border-left:2px solid var(--sel); border-radius:0 6px 6px 0; margin-left:4px; }
.layers .row.dropA{ box-shadow:inset 0 2px 0 var(--sel); } .layers .row.dropB{ box-shadow:inset 0 -2px 0 var(--sel); }
.x{ appearance:none; border:0; background:none; color:var(--ink-3); cursor:pointer; border-radius:4px; padding:2px 4px; line-height:1; font-size:13px; }
.x:hover{ color:var(--ink); background:var(--panel-2); }
.empty-note{ color:var(--ink-3); padding:10px 14px; line-height:1.6; font-size:12.5px; }

/* properties */
.sec{ padding:12px 14px 14px; border-bottom:1px solid var(--line); }
.sec h4{ margin:0 0 10px; font-size:12px; font-weight:600; color:var(--ink); display:flex; justify-content:space-between; align-items:center; }
.g2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.g3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.nf{ min-width:0; display:flex; align-items:center; background:var(--panel-2); border:1px solid transparent; border-radius:6px; height:30px; }
.nf:focus-within{ border-color:var(--sel); background:var(--panel); }
.nf span{ width:26px; flex:none; text-align:center; color:var(--ink-3); cursor:ew-resize; user-select:none; font-size:11.5px; }
.nf input{ width:100%; min-width:0; border:0; background:none; outline:none; padding:0 6px 0 0; height:28px; font-size:12.5px; }
.fld{ width:100%; background:var(--panel-2); border:1px solid transparent; border-radius:6px; height:30px; padding:0 8px; outline:none; font-size:12.5px; }
.fld:focus{ border-color:var(--sel); background:var(--panel); }
textarea.fld{ height:auto; min-height:72px; padding:7px 8px; resize:vertical; line-height:1.55; }
.lbl{ font-size:11.5px; color:var(--ink-3); margin:10px 0 5px; display:block; }
.lbl:first-child{ margin-top:0; }
.cf{ min-width:0; display:flex; align-items:center; gap:6px; background:var(--panel-2); border-radius:6px; height:30px; padding:0 4px; border:1px solid transparent; }
.cf:focus-within{ border-color:var(--sel); background:var(--panel); }
.cf input[type=color]{ width:22px; height:22px; border:1px solid var(--line); border-radius:5px; padding:0; background:none; cursor:pointer; flex:none; }
.cf input[type=color]::-webkit-color-swatch-wrapper{ padding:0; } .cf input[type=color]::-webkit-color-swatch{ border:0; border-radius:4px; }
.cf input[type=text]{ flex:1; min-width:0; border:0; background:none; outline:none; font-size:12.5px; text-transform:uppercase; }
.seg{ display:flex; background:var(--panel-2); border-radius:6px; padding:2px; gap:2px; }
.seg button{ flex:1; appearance:none; border:0; background:none; border-radius:5px; height:26px; cursor:pointer; font-size:12px; color:var(--ink-2); }
.seg button[aria-pressed="true"]{ background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.ibtns{ display:flex; gap:2px; }
.ibtns button{ flex:1; appearance:none; border:0; background:none; height:28px; border-radius:5px; cursor:pointer; color:var(--ink-2); display:flex; align-items:center; justify-content:center; }
.ibtns button:hover{ background:var(--panel-2); color:var(--ink); }
.ibtns svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; }
.btn{ appearance:none; border:1px solid var(--line); background:var(--panel); border-radius:6px; height:30px; padding:0 10px; cursor:pointer; font-size:12.5px; white-space:nowrap; }
.btn:hover{ border-color:var(--ink-3); }
.btn.wide{ width:100%; }
.btn.danger{ color:#D6453D; }
.rng{ display:grid; grid-template-columns:44px 1fr 38px; align-items:center; gap:8px; margin-top:6px; font-size:11.5px; color:var(--ink-3); }
.rng input[type=range]{ width:100%; accent-color:var(--sel); }
.rng b{ font-weight:400; text-align:right; color:var(--ink-2); }
.opts{ display:flex; flex-wrap:wrap; gap:4px; }
.opts button{ appearance:none; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; color:var(--ink-2); }
.opts button[aria-pressed="true"]{ background:var(--ink); color:var(--panel); border-color:var(--ink); }
.shapes{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }
.shapes button{ appearance:none; border:1px solid transparent; background:var(--panel-2); border-radius:6px; aspect-ratio:1; cursor:pointer; padding:5px; }
.shapes button[aria-pressed="true"]{ border-color:var(--sel); }
.shapes img{ width:100%; height:100%; display:block; }
.fontsel option{ font-size:14px; }
.kbd{ color:var(--ink-3); font-size:12px; line-height:1.9; }
.kbd b{ display:inline-block; min-width:62px; font-weight:500; color:var(--ink-2); }

/* viewport */
.vp{ position:relative; overflow:hidden; background:var(--canvas); touch-action:none; min-width:0; min-height:0; }
.vp.pan, .vp.pan *{ cursor:grab !important; }
.vp.panning, .vp.panning *{ cursor:grabbing !important; }
.vp.draw{ cursor:crosshair; }
.world{ position:absolute; left:0; top:0; transform-origin:0 0; }
.pglabel{ position:absolute; left:0; top:-26px; font-size:12px; color:var(--ink-3); white-space:nowrap; transform-origin:0 100%; }
.board{ position:absolute; left:0; top:0; overflow:hidden; box-shadow:0 2px 18px rgba(30,20,50,.13); }
.el{ position:absolute; transform-origin:50% 50%; }
.el.t.vert{ display:flex; flex-direction:row-reverse; align-items:flex-start; white-space:nowrap; }
.el.t.vert .vc{ display:flex; flex-direction:column; align-items:center; }
.el.t.vert .vc span{ display:block; }
.el.t.vert .vc span.rc{ transform:rotate(90deg); }
.el.t{ white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; min-height:1em; outline:none; }
.el.t[contenteditable]:not([contenteditable="false"]){ cursor:text; }
.el.img{ background-repeat:no-repeat; }
.el.img.none{ background:repeating-linear-gradient(45deg,#EFEAF6 0 14px,#E7E0F1 14px 28px); display:flex; align-items:center; justify-content:center; }
.el.img.none span{ font:500 max(14px, 4%) 'IBM Plex Sans KR',sans-serif; color:#8E7DB5; background:rgba(255,255,255,.8); padding:.4em .9em; border-radius:999px; white-space:nowrap; font-size:18px; }
.el.stk{ background-size:100% 100%; background-repeat:no-repeat; }
.el.lock{ pointer-events:none; }
.ov{ position:absolute; inset:0; pointer-events:none; }
.ov .bx{ position:absolute; border:1.5px solid var(--sel); transform-origin:50% 50%; }
.ov .bx.hov{ border-width:1.5px; opacity:.7; }
.ov .bx.multi{ border-style:dashed; }
.ov .hd{ position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; background:#fff; border:1.5px solid var(--sel); border-radius:2px; pointer-events:auto; }
.ov .hd.rot{ border-radius:50%; width:12px; height:12px; margin:-6px 0 0 -6px; cursor:grab; }
.ov .hd.rot::after{ content:''; position:absolute; left:4px; top:10px; width:1.5px; height:14px; background:var(--sel); }
.ov .sz{ position:absolute; background:var(--sel); color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; white-space:nowrap; transform:translateX(-50%); }
.ov .mq{ position:absolute; border:1px solid var(--sel); background:var(--sel-soft); }
.ov .gd{ position:absolute; background:#FF3D8B; }
.hint-drop{ position:absolute; inset:12px; border:2px dashed var(--sel); border-radius:12px; background:var(--sel-soft); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--sel); pointer-events:none; z-index:5; }


/* layout gallery */
.modal{ position:fixed; inset:0; z-index:70; background:rgba(18,14,28,.55); display:flex; align-items:center; justify-content:center; padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px)); }
.gal{ background:var(--panel); color:var(--ink); border-radius:16px; width:min(1120px,100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(10,5,25,.35); overflow:hidden; }
.gal-h{ padding:22px 24px 14px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; }
.gal-h h3{ margin:0; font-size:20px; font-weight:700; flex:1 1 auto; }
.gal-h p{ margin:4px 0 0; font-size:13px; color:var(--ink-3); font-weight:400; }
.gal-f{ display:flex; gap:6px; flex-wrap:wrap; padding:12px 24px 0; }
.chipb{ appearance:none; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; color:var(--ink-2); }
.chipb[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--panel); }
.gal-c{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 24px 0; font-size:13px; color:var(--ink-2); }
.gal-c span:first-child{ font-weight:600; margin-right:4px; }
.gal-b{ overflow:auto; padding:18px 24px 26px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:22px 18px; }
.tc{ appearance:none; border:0; background:none; padding:0; text-align:left; cursor:pointer; color:inherit; display:flex; flex-direction:column; justify-content:flex-start; align-self:start; }
.tc .tb2{ height:230px; border-radius:12px; background:var(--panel-2); position:relative; overflow:hidden; border:1px solid var(--line); transition:border-color .15s; }
.tc:hover .tb2, .tc:focus-visible .tb2{ border-color:var(--sel); }
.tc .tb2 > div{ position:absolute; transform-origin:0 0; box-shadow:0 2px 10px rgba(30,20,50,.18); pointer-events:none; overflow:hidden; }
.tc .cat{ display:block; font-size:11.5px; color:var(--sel); margin:10px 2px 2px; font-weight:600; }
.tc b{ display:block; font-size:14.5px; font-weight:600; margin:0 2px; }
.tc small{ display:block; font-size:12.5px; color:var(--ink-3); margin:3px 2px 0; line-height:1.45; }
.gal .seg{ min-width:330px; } .gal .seg button{ white-space:nowrap; padding:0 10px; }
@media (max-width:600px){ .gal-b{ grid-template-columns:repeat(2,minmax(0,1fr)); padding:14px; gap:16px 12px; } .tc .tb2{ height:180px; } .gal-h,.gal-f{ padding-left:14px; padding-right:14px; } .gal .seg{ min-width:0; width:100%; } }

/* menus */
.menu{ position:absolute; top:44px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 40px rgba(20,10,40,.22); padding:6px; z-index:60; width:280px; }
.menu button.mi{ display:flex; width:100%; appearance:none; border:0; background:none; text-align:left; padding:8px 10px; border-radius:6px; cursor:pointer; flex-direction:column; }
.menu button.mi:hover:not(:disabled){ background:var(--panel-2); }
.menu button.mi:disabled{ opacity:.4; cursor:not-allowed; }
.menu button.mi b{ font-weight:500; font-size:13px; }
.menu button.mi small{ color:var(--ink-3); font-size:11.5px; margin-top:1px; }
.menu.ctx{ width:230px; padding:5px; }
.menu.ctx button.mi{ flex-direction:row; justify-content:space-between; align-items:center; padding:7px 10px; }
.menu.ctx button.mi small{ margin:0; }
.menu hr{ border:0; border-top:1px solid var(--line); margin:5px 2px; }
.menu .cap{ font-size:11.5px; color:var(--ink-3); padding:6px 10px 4px; line-height:1.5; }
.stkmenu{ width:300px; }
.stkmenu .shapes{ grid-template-columns:repeat(6,1fr); gap:6px; padding:6px; }
.toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--chrome); color:var(--chrome-ink); padding:10px 16px; border-radius:8px; font-size:13px; z-index:99; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25); }
.busy{ position:fixed; inset:0; z-index:98; background:rgba(15,10,25,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }

@media (max-width:860px){
  #app{ grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
  .tb{ flex-wrap:wrap; padding:4px 6px; gap:2px; }
  .tb .fname{ width:110px; }
  .tools{ order:5; width:100%; justify-content:center; margin:0; }
  .mobonly{ display:inline-flex !important; }
  .deskonly{ display:none !important; }
  .left,.right{ position:fixed; z-index:50; top:calc(124px + env(safe-area-inset-top,0px)); bottom:0; width:min(300px,86vw); box-shadow:0 0 40px rgba(0,0,0,.25); }
  .left{ left:0; } .right{ right:0; }
  .left:not(.open),.right:not(.open){ display:none; }
  .vp{ grid-column:1; }
}
</style>
</head>
<body>
<div id="app">
  <header class="tb" id="tb"></header>
  <aside class="panel left" id="left"></aside>
  <div class="vp" id="vp">
    <div class="world" id="world"><div class="pglabel" id="pglabel"></div><div class="board" id="board"></div></div>
    <div class="ov" id="ov"></div>
  </div>
  <aside class="panel right" id="right"></aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";

  ['Noto Sans KR','노토 산스'],['IBM Plex Sans KR','플렉스 산스'],['Gowun Dodum','고운돋움'],['Gowun Batang','고운바탕'],
  ['Nanum Myeongjo','나눔명조'],['Hahmlet','함렛'],['Song Myung','송명'],['Do Hyeon','도현'],['Black Han Sans','검은고딕'],

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){ const v = attrs[k]; if (v==null || v===false) continue;
    if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (['value','hidden','disabled','multiple','checked','draggable'].includes(k)) el[k] = v;
    else el.setAttribute(k, v===true ? '' : v); }
  for (const c of kids.flat()){ if (c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}

    const b = bbox(els); const [cx,by] = scr(b.x + b.w/2, b.y + b.h);
    ov.append(h('div',{class:'sz',style:`left:${cx}px;top:${by+10}px`}, `${Math.round(els.length===1?els[0].w:b.w)} × ${Math.round(els.length===1?els[0].h:b.h)}`));
  }
  guides.forEach(g=>{
    if (g.v!=null){ const [x] = scr(g.v,0); const [,y1] = scr(0,g.a), [,y2] = scr(0,g.b); ov.append(h('div',{class:'gd',style:`left:${x}px;top:${y1}px;width:1px;height:${y2-y1}px`})); }
    else { const [,y] = scr(0,g.hz); const [x1] = scr(g.a,0), [x2] = scr(g.b,0); ov.append(h('div',{class:'gd',style:`left:${x1}px;top:${y}px;height:1px;width:${x2-x1}px`})); }
  });
  if (marquee){ const x = Math.min(marquee.x1,marquee.x2), y = Math.min(marquee.y1,marquee.y2); ov.append(h('div',{class:'mq',style:`left:${x}px;top:${y}px;width:${Math.abs(marquee.x2-marquee.x1)}px;height:${Math.abs(marquee.y2-marquee.y1)}px`})); }
}

/* ================= selection ================= */
function select(ids, keepPanel){
  S.sel = ids.filter(id=>byId(id)); if (S.editing && !S.sel.includes(S.editing)) endEdit();
  renderOverlay(); renderLayers(); renderProps();
  if (window.innerWidth<=860 && S.sel.length && !keepPanel){ /* leave drawers as they are */ }
}

/* ================= pointer interactions ================= */
let drag = null, lastDown = { id:null, t:0 };
const vp = $('vp');
vp.addEventListener('pointerdown', ev=>{
  if (S.menu) closeMenu();

  const onEl = ev.target.closest('.el'), onHd = ev.target.closest('.hd');
  if (S.editing){
    if (onEl && onEl.dataset.id===S.editing) return;

    ev.preventDefault(); vp.setPointerCapture(ev.pointerId); vp.classList.add('panning');
    drag = { mode:'pan', sx:ev.clientX, sy:ev.clientY, vx:V.x, vy:V.y }; return;
  }
  if (ev.button!==0) return;
  if (['text','rect','ellipse'].includes(S.tool)){
    ev.preventDefault(); vp.setPointerCapture(ev.pointerId);
    drag = { mode:'draw', x0:pt.x, y0:pt.y, sx:pt.sx, sy:pt.sy, el:null }; return;
  }
  if (onHd){
    ev.preventDefault(); vp.setPointerCapture(ev.pointerId);
    const el = selEls()[0];
    drag = { mode: onHd.dataset.h==='rot' ? 'rot' : 'resize', hd:onHd.dataset.h, el, o:{...el}, p0:pt }; return;
  }
  if (onEl){
    const id = onEl.dataset.id, el = byId(id);
    const now = Date.now();
    if (lastDown.id===id && now-lastDown.t < 380){ lastDown = {id:null,t:0}; onDouble(el); return; }
    lastDown = { id, t:now };
    ev.preventDefault();
    const ids = (ev.ctrlKey||ev.metaKey) ? [id] : groupExpand([id]);
    if (ev.shiftKey){ select(S.sel.includes(id) ? S.sel.filter(x=>!ids.includes(x)) : [...new Set([...S.sel, ...ids])]); }
    else if (!S.sel.includes(id)) select(ids);
    vp.setPointerCapture(ev.pointerId);
    drag = { mode:'move', p0:pt, items:selEls().filter(e=>!e.locked).map(e=>({el:e, x:e.x, y:e.y})), moved:false, alt:ev.altKey };
    return;
  }
  // empty canvas: marquee
  ev.preventDefault(); vp.setPointerCapture(ev.pointerId);
  if (!ev.shiftKey && S.sel.length) select([]);
  drag = { mode:'marquee', base: ev.shiftKey ? [...S.sel] : [], p0:pt };
  marquee = { x1:pt.sx, y1:pt.sy, x2:pt.sx, y2:pt.sy };
});
vp.addEventListener('pointermove', ev=>{
  if (!drag){
    const t = ev.target.closest('.el'); const hid = t ? t.dataset.id : null;
    if (hid !== S.hover){ S.hover = hid; renderOverlay(); }
    return;
  }
  const pt = toPage(ev);
  if (drag.mode==='pan'){ V.x = drag.vx + ev.clientX - drag.sx; V.y = drag.vy + ev.clientY - drag.sy; applyView(); return; }
  if (drag.mode==='draw'){
    if (!drag.el && Math.hypot(pt.sx-drag.sx, pt.sy-drag.sy) < 4) return;
    if (!drag.el){ drag.el = mk(S.tool, { x:drag.x0, y:drag.y0, w:1, h:1 }); if (S.tool==='text') drag.el.text=''; page().els.push(drag.el); $('board').append(elNode(drag.el,'edit')); S.sel=[drag.el.id]; }
    let x1 = drag.x0, y1 = drag.y0, x2 = pt.x, y2 = pt.y;
    if (ev.shiftKey){ const d = Math.max(Math.abs(x2-x1), Math.abs(y2-y1)); x2 = x1 + Math.sign(x2-x1||1)*d; y2 = y1 + Math.sign(y2-y1||1)*d; }
    Object.assign(drag.el, { x:Math.round(Math.min(x1,x2)), y:Math.round(Math.min(y1,y2)), w:Math.max(1,Math.round(Math.abs(x2-x1))), h:Math.max(1,Math.round(Math.abs(y2-y1))) });
    applyStyle(nodeOf(drag.el.id), drag.el, 'edit'); renderOverlay(); return;
  }
  if (drag.mode==='move'){
    let dx = pt.x - drag.p0.x, dy = pt.y - drag.p0.y;
    if (!drag.moved && Math.hypot(dx,dy)*V.z < 3) return;
    if (!drag.moved && drag.alt){ // alt-drag duplicates
      const copies = drag.items.map(it=>{ const c = JSON.parse(JSON.stringify(it.el)); c.id = uid(); c.x = it.x; c.y = it.y; return c; });
      page().els.push(...copies); drag.items = copies.map(c=>({el:c,x:c.x,y:c.y})); S.sel = copies.map(c=>c.id); renderBoard(); renderLayers();
    }
    drag.moved = true;
    if (ev.shiftKey){ if (Math.abs(dx)>Math.abs(dy)) dy = 0; else dx = 0; }
    const snapped = snapMove(dx, dy, drag.items, ev.ctrlKey||ev.metaKey);
    drag.items.forEach(it=>{ it.el.x = Math.round(it.x + snapped.dx); it.el.y = Math.round(it.y + snapped.dy); const n = nodeOf(it.el.id); if (n){ n.style.left = it.el.x+'px'; n.style.top = it.el.y+'px'; } });

  if (drag.mode==='rot'){

  }

    const x1 = Math.min(drag.p0.x, pt.x), y1 = Math.min(drag.p0.y, pt.y), x2 = Math.max(drag.p0.x, pt.x), y2 = Math.max(drag.p0.y, pt.y);
    const hit = page().els.filter(e=>!e.hidden && !e.locked && e.x < x2 && e.x+e.w > x1 && e.y < y2 && e.y+e.h > y1).map(e=>e.id);

  }
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null; guides = []; vp.classList.remove('panning');
  if (d.mode==='draw'){
    if (!d.el){ // click: default size
      const el = mk(S.tool); el.x = Math.round(d.x0); el.y = Math.round(d.y0);
      if (S.tool!=='text'){ el.x -= el.w/2; el.y -= el.h/2; }
      page().els.push(el); d.el = el; $('board').append(elNode(el,'edit'));
    }
    if (d.el.type==='text' && !d.el.text) d.el.text = '텍스트';
    const el = d.el; setTool('select'); measure(el); select([el.id]); commit();
    if (el.type==='text') startEdit(el, true);
    return;
  }
  if (d.mode==='marquee'){ marquee = null; select(S.sel); return; }
  if (d.mode==='pan') return;
  if (d.mode==='move' && !d.moved){ renderOverlay(); return; }

}
vp.addEventListener('pointerup', endDrag); vp.addEventListener('pointercancel', endDrag);
vp.addEventListener('pointerleave', ()=>{ if (!drag && S.hover){ S.hover=null; renderOverlay(); } });

function doResize(d, pt, shift){
  const o = d.o, k = d.hd, rad = (o.rot||0)*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  const gx = pt.x - d.p0.x, gy = pt.y - d.p0.y;
  const lx = gx*cos + gy*sin, ly = -gx*sin + gy*cos;
  let w = o.w, hh = o.h;
  if (k.includes('e')) w = o.w + lx; if (k.includes('w')) w = o.w - lx;
  if (k.includes('s')) hh = o.h + ly; if (k.includes('n')) hh = o.h - ly;
  const corner = k.length===2;
  const keep = (shift ? !(d.el.type==='image'||d.el.type==='sticker') || true : false) && corner;
  if (keep){ const r = o.w/o.h; if (Math.abs(w/o.w) > Math.abs(hh/o.h)) hh = w/r; else w = hh*r; }
  w = Math.max(4, w); hh = Math.max(4, hh);
  if (d.el.type==='text') hh = o.h;
  const ax0 = k.includes('e') ? -o.w/2 : k.includes('w') ? o.w/2 : 0, ay0 = k.includes('s') ? -o.h/2 : k.includes('n') ? o.h/2 : 0;
  const ax1 = k.includes('e') ? -w/2 : k.includes('w') ? w/2 : 0, ay1 = k.includes('s') ? -hh/2 : k.includes('n') ? hh/2 : 0;
  const c0x = o.x + o.w/2, c0y = o.y + o.h/2;
  const awx = c0x + ax0*cos - ay0*sin, awy = c0y + ax0*sin + ay0*cos;
  const cx = awx - (ax1*cos - ay1*sin), cy = awy - (ax1*sin + ay1*cos);
  d.el.w = Math.round(w); d.el.h = Math.round(hh); d.el.x = Math.round(cx - w/2); d.el.y = Math.round(cy - hh/2);
}
function snapMove(dx, dy, items, off){
  guides = [];
  if (off || !S.view.snap) return {dx,dy};
  const mov = items.map(i=>i.el), ids = new Set(mov.map(e=>e.id));
  const o = bbox(items.map(i=>({x:i.x,y:i.y,w:i.el.w,h:i.el.h})));
  const p = page(), th = 6/V.z;
  const xs = [0, p.w/2, p.w], ys = [0, p.h/2, p.h];
  p.els.forEach(e=>{ if (ids.has(e.id)||e.hidden) return; xs.push(e.x, e.x+e.w/2, e.x+e.w); ys.push(e.y, e.y+e.h/2, e.y+e.h); });
  const bx = [o.x+dx, o.x+o.w/2+dx, o.x+o.w+dx], by = [o.y+dy, o.y+o.h/2+dy, o.y+o.h+dy];
  let best = null; bx.forEach(v=>xs.forEach(t=>{ const d = t-v; if (Math.abs(d)<th && (!best||Math.abs(d)<Math.abs(best.d))) best = {d,t}; }));
  let bestY = null; by.forEach(v=>ys.forEach(t=>{ const d = t-v; if (Math.abs(d)<th && (!bestY||Math.abs(d)<Math.abs(bestY.d))) bestY = {d,t}; }));
  if (best){ dx += best.d; guides.push({ v:best.t, a:Math.min(0,o.y+dy)-20, b:Math.max(p.h, o.y+o.h+dy)+20 }); }
  if (bestY){ dy += bestY.d; guides.push({ hz:bestY.t, a:Math.min(0,o.x+dx)-20, b:Math.max(p.w, o.x+o.w+dx)+20 }); }
  if (S.view.grid){ const z = S.view.gs||20; if (!best) dx += Math.round((o.x+dx)/z)*z - (o.x+dx); if (!bestY) dy += Math.round((o.y+dy)/z)*z - (o.y+dy); }
  return {dx,dy};
}
vp.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) zoomAt(V.z*Math.exp(-ev.deltaY*0.0022), ev.clientX-r.left, ev.clientY-r.top);
  else { V.x -= ev.shiftKey && !ev.deltaX ? ev.deltaY : ev.deltaX; V.y -= ev.shiftKey && !ev.deltaX ? 0 : ev.deltaY; applyView(); }
}, { passive:false });
// pinch zoom on touch
const tps = new Map(); let pinch = null;
vp.addEventListener('pointerdown', ev=>{ if (ev.pointerType!=='touch') return; tps.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if (tps.size===2){ drag=null; const [a,b] = [...tps.values()]; pinch = { d:Math.hypot(a.x-b.x,a.y-b.y), z:V.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vx:V.x, vy:V.y }; } }, true);
vp.addEventListener('pointermove', ev=>{ if (!tps.has(ev.pointerId)) return; tps.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if (pinch && tps.size===2){ const [a,b] = [...tps.values()]; const r = vp.getBoundingClientRect(); const d = Math.hypot(a.x-b.x,a.y-b.y);
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2; V.x = pinch.vx + (mx-pinch.mx); V.y = pinch.vy + (my-pinch.my); zoomAt(pinch.z*d/pinch.d, mx-r.left, my-r.top); pinch.vx = V.x - (mx-pinch.mx); pinch.vy = V.y - (my-pinch.my); pinch.z = V.z; pinch.d = d; pinch.mx = mx; pinch.my = my; } }, true);
const tpEnd = ev=>{ tps.delete(ev.pointerId); if (tps.size<2) pinch = null; };
vp.addEventListener('pointerup', tpEnd, true); vp.addEventListener('pointercancel', tpEnd, true);

/* drag & drop images */
let dropHint = null;
vp.addEventListener('dragover', ev=>{ if ([...ev.dataTransfer.types].includes('Files')){ ev.preventDefault(); if (!dropHint){ dropHint = h('div',{class:'hint-drop'},'놓으면 이미지가 추가돼요'); vp.append(dropHint); } } });

vp.addEventListener('drop', async ev=>{

/* ================= editing text ================= */
function onDouble(el){
  if (!el || el.locked) return;
  if (el.type==='text'){ if (el.vert){ S.openR = true; applyDrawers(); const ta = document.querySelector('#right textarea[data-text]'); if (ta){ ta.focus(); ta.select(); } } else startEdit(el); }
  else if (el.type==='image') replaceImage(el);
}
function startEdit(el, selectAll){
  const n = nodeOf(el.id); if (!n) return;
  S.editing = el.id; n.dataset.editing = '1';
  try { n.contentEditable = 'plaintext-only'; } catch(e){}
  if (n.contentEditable !== 'plaintext-only') n.contentEditable = 'true';
  n.focus();
  const r = document.createRange(); r.selectNodeContents(n); if (!selectAll) r.collapse(false);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  n.oninput = ()=>{ el.text = n.innerText.replace(/\n$/,''); measure(el, n); renderOverlay(); renderLayers(); commitSoon(); syncTextArea(el); };
  n.onpaste = e=>{ e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain')); };
  n.onkeydown = e=>{ if (e.key==='Escape'){ e.preventDefault(); endEdit(); } };
  renderOverlay();
}
function endEdit(){
  const id = S.editing; if (!id) return; S.editing = null;
  const n = nodeOf(id), el = byId(id);
  if (n){ n.contentEditable = 'false'; n.removeAttribute('contenteditable'); delete n.dataset.editing; n.oninput = n.onpaste = n.onkeydown = null; if (el){ el.text = n.innerText.replace(/\n$/,''); if (!el.text.trim()){ page().els = page().els.filter(e=>e.id!==id); S.sel = S.sel.filter(x=>x!==id); renderBoard(); } else applyStyle(n, el, 'edit'); } }
  window.getSelection()?.removeAllRanges();
  renderOverlay(); renderLayers(); renderProps(); commit();
}
function syncTextArea(el){ const ta = document.querySelector('#right textarea[data-text]'); if (ta && document.activeElement!==ta) ta.value = el.text; }

/* ================= element ops ================= */
function visibleCenter(){ const r = vp.getBoundingClientRect(); const p = page(); let x = (r.width/2 - V.x)/V.z, y = (r.height/2 - V.y)/V.z; return { x:clamp(x,0,p.w), y:clamp(y,0,p.h) }; }
function addEl(el){ page().els.push(el); renderBoard(); select([el.id]); commit(); }
async function addImages(files, at){
  const p = page(); const c = at || visibleCenter(); const ids = [];
  for (const [i,f] of files.entries()){
    try { const aid = await readImg(f, 2400); const a = A[aid];
      const sc = Math.min(1, (p.w*.6)/a.w, (p.h*.6)/a.h); const w = Math.round(a.w*sc), hh = Math.round(a.h*sc);
      const el = mk('image',{ asset:aid, w, h:hh, x:Math.round(c.x - w/2 + i*24), y:Math.round(c.y - hh/2 + i*24), name:f.name.replace(/\.[^.]+$/,'').slice(0,20) });
      p.els.push(el); ids.push(el.id);
    } catch(e){ toast('이미지를 읽지 못했어요: '+f.name); }
  }
  if (ids.length){ renderBoard(); select(ids); commit(); }
}
function replaceImage(el){ pick('image/*', false, async ([f])=>{ if (!f) return; try { el.asset = await readImg(f, 2400); el.iz=1; el.ix=50; el.iy=50; refresh([el]); renderProps(); commit(); } catch(e){ toast('이미지를 읽지 못했어요.'); } }); }
function delSel(){ if (!S.sel.length) return; const s = new Set(S.sel); page().els = page().els.filter(e=>!s.has(e.id)); S.sel=[]; renderBoard(); renderLayers(); renderProps(); commit(); }
function groupExpand(ids){
  const gs = new Set(ids.map(byId).filter(e=>e && e.g).map(e=>e.g)); if (!gs.size) return ids;
  return [...new Set([...ids, ...page().els.filter(e=>e.g && gs.has(e.g) && !e.locked && !e.hidden).map(e=>e.id)])];
}
function remapGroups(copies){ const m = {}; copies.forEach(c=>{ if (c.g){ m[c.g] = m[c.g] || uid(); c.g = m[c.g]; } }); return copies; }
function groupSel(){ const els = selEls(); if (els.length<2){ toast('두 개 이상 골라야 묶을 수 있어요.'); return; } const g = uid(); els.forEach(e=>e.g=g); renderLayers(); renderProps(); commit(); toast('그룹으로 묶었어요. Ctrl을 누른 채 누르면 하나만 고를 수 있어요.'); }
function ungroupSel(){ const els = selEls(); if (!els.some(e=>e.g)){ toast('선택한 요소에 그룹이 없어요.'); return; } els.forEach(e=>{ delete e.g; }); renderLayers(); renderProps(); commit(); toast('그룹을 풀었어요.'); }
function pasteClip(){ if (!S.clip) return; const els = remapGroups(JSON.parse(S.clip).map(e=>{ e.id=uid(); e.x+=20; e.y+=20; return e; })); S.clip = JSON.stringify(els); page().els.push(...els); renderBoard(); select(els.map(e=>e.id)); commit(); }
function dupSel(off){
  const els = selEls(); if (!els.length) return;
  const copies = remapGroups(els.map(e=>{ const c = JSON.parse(JSON.stringify(e)); c.id = uid(); c.x += off; c.y += off; return c; }));
  const arr = page().els; const last = Math.max(...els.map(e=>arr.indexOf(e)));
  arr.splice(last+1, 0, ...copies); renderBoard(); select(copies.map(c=>c.id)); commit();
}
function reorder(how){
  const arr = page().els; const sel = new Set(S.sel); if (!sel.size) return;
  const picked = arr.filter(e=>sel.has(e.id)), rest = arr.filter(e=>!sel.has(e.id));
  if (how==='front') page().els = [...rest, ...picked];
  else if (how==='back') page().els = [...picked, ...rest];
  else {
    const a = arr.slice();
    if (how==='up'){ for (let i=a.length-2;i>=0;i--) if (sel.has(a[i].id) && !sel.has(a[i+1].id)) [a[i],a[i+1]]=[a[i+1],a[i]]; }
    else { for (let i=1;i<a.length;i++) if (sel.has(a[i].id) && !sel.has(a[i-1].id)) [a[i],a[i-1]]=[a[i-1],a[i]]; }
    page().els = a;
  }
  renderBoard(); renderLayers(); commit();
}
function align(how){
  const els = selEls().filter(e=>!e.locked); if (!els.length) return;
  const p = page(); const ref = els.length===1 ? {x:0,y:0,w:p.w,h:p.h} : bbox(els);
  if (how==='dH' || how==='dV'){
    if (els.length<3) return;
    const key = how==='dH' ? 'x' : 'y', sz = how==='dH' ? 'w' : 'h';
    const s = els.slice().sort((a,b)=>a[key]-b[key]); const tot = s.reduce((t,e)=>t+e[sz],0);
    const gap = (ref[sz]-tot)/(s.length-1); let c = ref[key]; s.forEach(e=>{ e[key] = Math.round(c); c += e[sz]+gap; });
  } else els.forEach(e=>{
    if (how==='aL') e.x = ref.x; if (how==='aC') e.x = Math.round(ref.x + (ref.w-e.w)/2); if (how==='aR') e.x = ref.x + ref.w - e.w;
    if (how==='aT') e.y = ref.y; if (how==='aM') e.y = Math.round(ref.y + (ref.h-e.h)/2); if (how==='aB') e.y = ref.y + ref.h - e.h;
  });

          r += (255-2*r)*I; g += (255-2*g)*I; b += (255-2*b)*I;
          p[i] = cl(r); p[i+1] = cl(g); p[i+2] = cl(b);
        }
        ctx.putImageData(d,0,0);
      }
      let out = cv.toDataURL('image/webp', .92); if (!out.startsWith('data:image/webp')) out = cv.toDataURL('image/png');
      res(out);
    };
    img.onerror = ()=>res(a.src); img.src = a.src;
  });
}
async function renderPageCanvas(p, scale){
  const holder = h('div',{style:'position:fixed;left:-30000px;top:0;'});
  const b = h('div',{style:`position:relative;overflow:hidden;width:${p.w}px;height:${p.h}px;background:${p.bg}`});
  const vis = p.els.filter(e=>!e.hidden);
  vis.forEach(e=>b.append(elNode(e,'export')));
  for (const e of vis){
    const a = e.type==='image' && e.asset && A[e.asset];
    if (!a || !fxOn(e.fx)) continue;
    const W = e.w - 2*(e.sw||0), H = e.h - 2*(e.sw||0);
    const sc = e.fit==='contain' ? Math.min(W/a.w, H/a.h) : Math.max(W/a.w, H/a.h)*(e.iz||1);
    const baked = await bakeImg(a, e.fx, 1/sc);
    const n = b.querySelector(`.el[data-id="${e.id}"]`); if (n) n.style.backgroundImage = `url("${baked}")`;
  }
  holder.append(b); document.body.append(holder);
  try { if (document.fonts) await document.fonts.ready; await Promise.all([...b.querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))); return await window.html2canvas(b, { scale, backgroundColor:p.bg, logging:false, width:p.w, height:p.h }); }
  finally { holder.remove(); }
}
async function exportPNG(pages){
  if (S.editing) endEdit();
  const busy = h('div',{class:'busy'},'이미지를 만드는 중…'); document.body.append(busy);
  try {
    await loadH2C();
    const totalH = pages.reduce((t,p)=>t+p.h,0), maxW = Math.max(...pages.map(p=>p.w));
    const scale = Math.max(.5, Math.min(2, 16000/totalH, 8000/maxW));
    const canvases = []; for (const p of pages) canvases.push(await renderPageCanvas(p, scale));
    let out = canvases[0];
    if (canvases.length>1){
      out = document.createElement('canvas'); out.width = Math.round(maxW*scale); out.height = canvases.reduce((t,c)=>t+c.height,0);
      const g = out.getContext('2d'); g.fillStyle = pages[0].bg; g.fillRect(0,0,out.width,out.height);
      let y = 0; canvases.forEach(c=>{ g.drawImage(c, Math.round((out.width-c.width)/2), y); y += c.height; });
    }
    const blob = await new Promise(r=>out.toBlob(r,'image/png'));
    busy.remove();
    await saveFile(safeName(doc.name) + (pages.length===1 && doc.pages.length>1 ? '-'+safeName(pages[0].name) : '') + '.png', blob, '이미지를 저장했어요.');
  } catch(e){ toast('이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  finally { busy.remove(); }
}
function saveJSON(){ saveFile(safeName(doc.name)+'.json', JSON.stringify({ app:'jacae-studio', v:1, doc, assets:usedAssets(doc) }), '작업 파일을 저장했어요.'); }
function openJSON(){
  pick('application/json,.json', false, async ([f])=>{
    if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.doc || !Array.isArray(j.doc.pages)) throw 0;
      Object.assign(A, j.assets||{}); commit(); doc = j.doc; if (!doc.pages.find(p=>p.id===doc.cur)) doc.cur = doc.pages[0].id; S.sel=[]; renderAll(); fitView(); commit(); toast('작업 파일을 열었어요.'); }
    catch(e){ toast('자캐 스튜디오에서 저장한 작업 파일이 아니에요.'); }
  });
}


/* ================= layout gallery ================= */
let galMode = 'new', galCat = '전체';
function openGallery(first){
  closeMenu(); document.querySelector('.modal')?.remove();
  const modal = h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':'레이아웃 고르기',onpointerdown:ev=>{ if (ev.target===modal) modal.remove(); }});
  const body = h('div',{class:'gal-b'});
  const drawCards = ()=>{
    body.replaceChildren(...TEMPLATES.filter(t=>galCat==='전체'||t.cat===galCat).map(t=>{
      const pages = t.build(); const p = pages[0];
      const thumb = h('div',{class:'tb2'});
      const board = h('div',{style:`width:${p.w}px;height:${p.h}px;background:${p.bg}`});
      p.els.filter(e=>!e.hidden).forEach(e=>board.append(elNode(e,'thumb')));
      thumb.append(board);
      const card = h('button',{class:'tc',type:'button',onclick:()=>applyTemplate(t, modal)}, thumb, h('span',{class:'cat'}, t.cat + (pages.length>1?` · ${pages.length}페이지`:'')), h('b',null,t.name), h('small',null,t.desc));
      card._fit = ()=>{ const W = thumb.clientWidth-24, H = thumb.clientHeight-24; const sc = Math.min(W/p.w, H/p.h); board.style.transform = `scale(${sc})`; board.style.left = ((thumb.clientWidth - p.w*sc)/2)+'px'; board.style.top = ((thumb.clientHeight - p.h*sc)/2)+'px'; };
      return card;
    }));
    requestAnimationFrame(()=>body.querySelectorAll('.tc').forEach(c=>c._fit()));
  };
  const chips = h('div',{class:'gal-f'}, TPL_CATS.map(c=>h('button',{class:'chipb',type:'button','aria-pressed':String(galCat===c),onclick:ev=>{ galCat=c; chips.querySelectorAll('.chipb').forEach(b=>b.setAttribute('aria-pressed',String(b===ev.currentTarget))); drawCards(); }},c)));
  const cw = h('input',{class:'fld',type:'number',min:50,max:6000,value:1080,'aria-label':'가로 크기',style:'width:90px'});
  const ch = h('input',{class:'fld',type:'number',min:50,max:12000,value:1350,'aria-label':'세로 크기',style:'width:90px'});
  const cbg = h('input',{type:'color',value:'#FFFFFF','aria-label':'배경 색',style:'width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer'});
  const custom = h('div',{class:'gal-c'}, h('span',null,'직접 크기 입력'), cw, h('span',null,'×'), ch, cbg,
    h('button',{class:'btn',type:'button',onclick:()=>{ const w = clamp(Math.round(+cw.value||1080),50,6000), hh = clamp(Math.round(+ch.value||1350),50,12000); applyTemplate({ name:'빈 캔버스', build:()=>[pg('페이지 1',w,hh,cbg.value,[])] }, modal); }},'빈 캔버스 만들기'));
  const mode = h('div',{class:'seg'}, [['new','새 문서로 시작'],['add','지금 문서에 페이지 추가']].map(([v,l])=>h('button',{type:'button','aria-pressed':String(galMode===v),onclick:ev=>{ galMode=v; mode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===ev.currentTarget))); }},l)));
  modal.append(h('div',{class:'gal'},
    h('div',{class:'gal-h'}, h('h3',null,'레이아웃 고르기', h('p',null, first ? '마음에 드는 틀로 시작해 보세요. 나중에 레이아웃 버튼에서 언제든 다시 열 수 있어요.' : '고른 레이아웃은 모든 요소를 자유롭게 옮기고 고칠 수 있어요.')), mode,
      h('button',{class:'x',type:'button','aria-label':'닫기',style:'font-size:20px',onclick:()=>modal.remove()},'×')),
    chips, custom, body));
  document.body.append(modal); drawCards();
  const onKey = ev=>{ if (ev.key==='Escape'){ modal.remove(); document.removeEventListener('keydown', onKey, true); } };
  document.addEventListener('keydown', onKey, true);
}
function applyTemplate(t, modal){
  const pages = t.build();
  if (S.editing) endEdit();
  commit();
  if (galMode==='add'){ doc.pages.push(...pages); doc.cur = pages[0].id; toast(`‘${t.name}’ 페이지를 추가했어요.`); }
  else { doc = { name: doc.name || '이름 없는 자캐', pages, cur:pages[0].id }; toast(`‘${t.name}’로 시작했어요. 이전 작업은 실행 취소로 되돌릴 수 있어요.`); }
  S.sel = []; modal.remove(); renderAll(); fitView(); commit();
}

/* ================= boot ================= */
function renderAll(){ loadDocFonts(); renderTb(); renderBoard(); renderLeft(); renderProps(); applyDrawers(); }
async function boot(){
  try { db = await idb(); const d = await idbDo('readonly', st=>st.get('doc')); const a = await idbDo('readonly', st=>st.get('assets'));
    if (d && Array.isArray(d.pages) && d.pages.length){ doc = d; Object.assign(A, a||{}); } } catch(e){ db = null; }
  let firstRun = false;
  if (!doc){ doc = starterDoc(); firstRun = true; }
  if (!doc.pages.find(p=>p.id===doc.cur)) doc.cur = doc.pages[0].id;
  hist = [JSON.stringify(doc)]; hi = 0;
  renderAll(); fitView();
  if (firstRun) openGallery(true);
  if (document.fonts) document.fonts.ready.then(()=>{ page().els.forEach(el=>measure(el)); renderOverlay(); });
  window.addEventListener('resize', ()=>{ renderOverlay(); });
  if (window.claude && typeof window.claude.use==='function') window.claude.use('downloads').then(d=>{ DL = d; }).catch(()=>{});
}
boot();
})();
